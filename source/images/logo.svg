<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="256" height="256">
	<!-- Background -->
	<rect width="120" height="120" rx="12" fill="#ffffff"/>

	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
			<path d="M 0,0 L 10,5 L 0,10 Z" fill="#3498db"/>
		</marker>
	</defs>

	<!-- Circular arrows (encode/decode round-trip) -->
	<g transform="translate(60, 48)">
		<!-- Encode: 11 o'clock clockwise ~150° to 4 o'clock -->
		<path d="M -17,-29.4 A 34,34 0 0 1 26,22" fill="none" stroke="#3498db" stroke-width="3.5" marker-end="url(#arrow)"/>
		<!-- Decode: 5 o'clock clockwise ~150° to 10 o'clock -->
		<path d="M 17,29.4 A 34,34 0 0 1 -26,-22" fill="none" stroke="#3498db" stroke-width="3.5" marker-end="url(#arrow)"/>
	</g>

	<!-- Padlock body -->
	<rect x="42" y="42" width="36" height="28" rx="4" fill="#e67e22"/>

	<!-- Padlock shackle -->
	<path d="M 50,42 L 50,32 A 10,10 0 0 1 70,32 L 70,42" fill="none" stroke="#f39c12" stroke-width="4" stroke-linecap="round"/>

	<!-- Keyhole -->
	<circle cx="60" cy="53" r="4" fill="#2c3e50"/>
	<rect x="58" y="53" width="4" height="8" rx="1" fill="#2c3e50"/>


	<!-- Text -->
	<text x="60" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#2c3e50" letter-spacing="2">CRYPTO</text>
</svg>
